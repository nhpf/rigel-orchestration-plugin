name: CI

on: [push, pull_request]

permissions:
  contents: read

env:
  POETRY_VERSION: "2.4.1"

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install Poetry
        run: python -m pip install "poetry==${POETRY_VERSION}"
      - name: Install dependencies
        run: poetry install --with dev
      - name: Lint
        run: poetry run ruff check src tests
      - name: Type-check
        run: poetry run mypy src tests --pretty
      - name: Validate and build package
        run: |
          poetry check
          poetry build

  unit:
    name: unit (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Poetry
        run: python -m pip install "poetry==${POETRY_VERSION}"
      - name: Install dependencies
        run: poetry install --with dev
      - name: Run unit tests
        run: poetry run pytest -m "not integration" --cov=src --cov-report=term-missing

  integration:
    name: integration
    runs-on: ubuntu-latest
    needs: [quality, unit]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install Poetry
        run: python -m pip install "poetry==${POETRY_VERSION}"
      - name: Install dependencies
        run: poetry install --with dev
      - name: Create kind cluster
        uses: helm/kind-action@v1
      - name: Verify Kubernetes client
        run: kubectl cluster-info
      - name: Run Kubernetes smoke test
        env:
          RUN_K8S_INTEGRATION: "1"
        run: poetry run pytest tests/test_integration.py -v --cov=src --cov-report=term-missing
