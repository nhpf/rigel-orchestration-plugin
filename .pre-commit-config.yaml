repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      # Run the linter.
      - id: ruff
        files: ^(src|tests)/.*\.py$
        args: [ --fix ]
      # Run the formatter.
      - id: ruff-format
        files: ^(src|tests)/.*\.py$

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.1
    hooks:
      - id: mypy
        files: ^(src|tests)/.*\.py$
        args: ["--pretty"]
